[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-sid"
version = "0.1.0"
description = "Request-level beam budgets for a lightweight TIGER-style recommender based on GRID."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gpu = ["torch>=2.1"]
hgb = ["scikit-learn>=1.3"]

[project.scripts]
budget-sid = "budget_sid.cli:main"

[tool.setuptools.packages.find]
include = ["budget_sid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
